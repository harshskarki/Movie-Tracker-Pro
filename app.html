<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎬 Movie Tracker Pro</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  color: white;
  text-align: center;
  margin: 0;
  padding: 0 0 60px 0;
}

.light {
  background: #f5f5f5;
  color: black;
}

h1 { color: #e50914; }

input, select {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
  background: #2a2a2a;
  color: white;
}

button {
  padding: 10px;
  background: #e50914;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 10px;
  border-radius: 10px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.small-btn {
  margin: 3px;
  padding: 5px;
  font-size: 12px;
}

#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  padding: 10px 20px;
  border-radius: 5px;
  display: none;
}

#loader {
  display: none;
  margin: 10px;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  color: #777;
  font-size: 12px;
  padding: 8px 0;
}
</style>
</head>

<body>

<h1>🎬 Movie Tracker Pro</h1>

<input id="movieInput" placeholder="Movie name">
<select id="category">
  <option>Action</option>
  <option>Comedy</option>
  <option>Drama</option>
  <option>Horror</option>
</select>

<button onclick="addMovie()">Add</button>
<button onclick="randomMovie()">🎲 Surprise</button>
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="logout()">🚪 Logout</button>

<br>

<input id="searchInput" placeholder="Search..." onkeyup="applyFilters()">

<br>

<select id="sortSelect" onchange="sortMovies()">
  <option value="default">Sort</option>
  <option value="rating">⭐ Rating</option>
  <option value="year">📅 Year</option>
</select>

<div id="loader">⏳ Loading...</div>

<div class="container" id="movieList"></div>

<div id="toast"></div>

<footer>Made by harshskarki Ⓗ</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCcUfxJmbe-iHSGSr8U_xDRKvG1Uz7okwM",
  authDomain: "movie-tracker-pro.firebaseapp.com",
  projectId: "movie-tracker-pro",
  storageBucket: "movie-tracker-pro.appspot.com",
  messagingSenderId: "261461241343",
  appId: "1:261461241343:web:727b75c82896b91ac0cbca",
  measurementId: "G-ZMRVPEWYGT"
};

  

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

firebase.auth().onAuthStateChanged(user => {
  if (user) loadMovies();
  else window.location.href = "login.html";
});

let movies = [];

function saveToDB(movie) {
  const user = firebase.auth().currentUser;
  db.collection("users").doc(user.uid).collection("movies").add(movie);
}

function loadMovies() {
  const user = firebase.auth().currentUser;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .onSnapshot(snapshot => {
      movies = [];
      snapshot.forEach(doc => {
        movies.push({ id: doc.id, ...doc.data() });
      });
      displayMovies();
    });
}

function showToast(msg) {
  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

async function fetchMovieData(name) {
  let res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=279e916fb273ebd5f4db034459cad740&query=${name}`);
  let data = await res.json();
  let m = data.results[0];

  return {
    poster: m?.poster_path ? "https://image.tmdb.org/t/p/w500" + m.poster_path : "",
    rating: m?.vote_average || "N/A",
    year: m?.release_date?.split("-")[0] || "N/A"
  };
}

async function addMovie() {
  let name = movieInput.value.trim();
  if (!name) return;

  document.getElementById("loader").style.display = "block";

  let data = await fetchMovieData(name);

  let movieObj = {
    name,
    watched: false,
    favorite: false,
    createdAt: Date.now(),
    ...data
  };

  saveToDB(movieObj);

  document.getElementById("loader").style.display = "none";

  showToast("✅ Added!");
  movieInput.value = "";
}

function deleteMovie(i) {
  if (!confirm("Delete?")) return;

  const user = firebase.auth().currentUser;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(movies[i].id)
    .delete();
}

function toggleWatched(i) {
  const user = firebase.auth().currentUser;
  let m = movies[i];

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(m.id)
    .update({ watched: !m.watched });
}

function toggleFavorite(i) {
  const user = firebase.auth().currentUser;
  let m = movies[i];

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(m.id)
    .update({ favorite: !m.favorite });
}

function editMovie(i) {
  let newName = prompt("Edit:", movies[i].name);
  if (!newName) return;

  const user = firebase.auth().currentUser;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(movies[i].id)
    .update({ name: newName });

  showToast("✏️ Updated");
}

function sortMovies() {
  let type = sortSelect.value;

  if (type === "rating") {
    movies.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else if (type === "year") {
    movies.sort((a, b) => (b.year || 0) - (a.year || 0));
  }

  displayMovies();
}

function displayMovies() {
  let c = document.getElementById("movieList");
  c.innerHTML = "";

  movies.forEach((m, i) => {
    c.innerHTML += `
      <div class="card">
        <img src="${m.poster}">
        <h3>
          ${m.name}
          ${Date.now() - m.createdAt < 86400000 ? "<span style='color:red'>NEW</span>" : ""}
        </h3>
        <p>⭐ ${m.rating} | 📅 ${m.year}</p>

        <button onclick="toggleWatched(${i})">✅</button>
        <button onclick="toggleFavorite(${i})">⭐</button>
        <button onclick="editMovie(${i})">✏️</button>
        <button onclick="deleteMovie(${i})">🗑</button>
      </div>
    `;
  });
}

function toggleTheme() {
  document.body.classList.toggle("light");
}

function randomMovie() {
  let m = movies[Math.floor(Math.random() * movies.length)];
  showToast("🎬 " + m.name);
}

function logout() {
  firebase.auth().signOut();
}
</script>

</body>
</html>
