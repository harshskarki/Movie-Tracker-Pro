
<!DOCTYPE html>
<html>
<head>
  <title>Login - Movie Tracker Pro</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #000000, #1a1a1a, #e50914, #000000);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50% }
      50% { background-position: 100% 50% }
      100% { background-position: 0% 50% }
    }

    .input-error {
    box-shadow: 0 0 12px red !important;
    border: 1px solid red !important;
  }
    
    .card {
      backdrop-filter: blur(20px);
      background: rgba(20,20,20,0.8);
      padding: 40px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.7);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #e50914;
      margin-bottom: 25px;
    }

    .input-box {
      position: relative;
      margin: 15px 0;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #2a2a2a;
      color: white;
      outline: none;
    }

    .input-box label {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 13px;
      pointer-events: none;
      transition: 0.3s;
    }

    .input-box input:focus + label,
    .input-box input:not(:placeholder-shown) + label {
      top: -8px;
      font-size: 11px;
      color: #e50914;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      font-size: 12px;
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #e50914;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      position: relative;
    }

    button:hover {
      transform: scale(1.05);
      background: #ff1f1f;
    }

    button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .google-btn {
      background: white;
      color: black;
    }

    .google-btn:hover {
      background: #ddd;
    }

  #error {
  display: block; /* ✅ ADD THIS LINE */
  color: #ff4c4c;
  font-size: 13px;
  margin-top: 10px;
  text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
  animation: shake 0.3s, fadeIn 0.3s;
  min-height: 18px; /* keeps space even when empty */
}

/* 💥 Shake animation */
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

/* ✨ Smooth fade in */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    #loader {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>🎬 Movie Tracker</h2>

  <div class="input-box">
    <input id="email" placeholder=" " />
    <label>Email</label>
  </div>

  <div class="input-box">
    <input id="password" type="password" placeholder=" " />
    <label>Password</label>
    <span class="toggle" onclick="togglePass()">SHOW</span>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <button onclick="signup()">Create Account</button>

  <button class="google-btn" onclick="googleLogin()">Sign in with Google</button>

  <div id="loader">⏳ Loading...</div>
  <div id="error" style="
  color: #ff4d4d;
  margin-top: 10px;
  font-size: 14px;
  min-height: 18px;
  transition: 0.3s;
"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCcUfxJmbe-iHSGSr8U_xDRKvG1Uz7okwM",
  authDomain: "movie-tracker-pro.firebaseapp.com",
  projectId: "movie-tracker-pro",
};

firebase.initializeApp(firebaseConfig);

firebase.auth().onAuthStateChanged(user => {
  if (user) {
    setTimeout(() => {
      window.location.href = "app.html";
    }, 800);
  }
});

function showError(msg) {
  const el = document.getElementById("error");

  // set message
  el.innerText = msg;

  // 🔥 RESET animation so it triggers EVERY time
  el.style.animation = "none";
  el.offsetHeight; // force reflow
  el.style.animation = "shake 0.3s";

  // ⏳ auto clear after 3 sec
  if (msg) {
    setTimeout(() => {
      el.innerText = "";
    }, 3000);
  }
}
  
function showLoader(show) {
  const loader = document.getElementById("loader");
  loader.style.display = show ? "block" : "none";
  loader.innerText = show ? "⏳ Authenticating..." : "";
}

function togglePass() {
  let pass = document.getElementById("password");
  let toggle = document.querySelector(".toggle");

  if (pass.type === "password") {
    pass.type = "text";
    toggle.innerText = "HIDE";
  } else {
    pass.type = "password";
    toggle.innerText = "SHOW";
  }
}

async function login() {
  const btn = document.getElementById("loginBtn");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  let isSuccess = false;
  
  try {
    showLoader(true);
    showError("");

    btn.disabled = true;
    btn.classList.add("loading");
    
    const email = emailEl.value.trim();
    const pass = passEl.value.trim();

    // ✅ FRONTEND VALIDATION (FAANG STYLE)
    if (!email || !pass) {
      throw { code: "empty-fields" };
    }

    if (!email.includes("@") || !email.includes(".")) {
      throw { code: "invalid-email-format" };
    }

    if (pass.length < 6) {
      throw { code: "weak-password" };
    }

    // 🔐 Firebase login
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    isSuccess = true;
    
    // ✅ SUCCESS ANIMATION
    showLoader(false);
    btn.innerText = "✅ Success!";
    btn.style.background = "green";

    setTimeout(() => {
      window.location.href = "app.html";
    }, 800);

  } catch (err) {
  console.log("ERROR FULL:", err);

  let msg = "❌ Login failed";

  const code = err.code || err.message;

  if (code === "empty-fields") {
    msg = "⚠️ Please fill all fields";
  }
  else if (code === "invalid-email-format") {
    msg = "⚠️ Enter a valid email";
  }
  else if (code === "weak-password") {
    msg = "🔒 Password must be at least 6 characters";
  }
  else if (code.includes("auth/invalid-email")) {
    msg = "⚠️ Invalid email format";
  }
  else if (
    code.includes("auth/invalid-credential") ||
    code.includes("auth/wrong-password") ||
    code.includes("auth/user-not-found")
  ) {
    msg = "❌ Invalid email or password";
  }

  showError(msg);

  // ✅ MOVE INPUT ERROR EFFECT HERE
  emailEl.classList.add("input-error");
  passEl.classList.add("input-error");

  setTimeout(() => {
    emailEl.classList.remove("input-error");
    passEl.classList.remove("input-error");
  }, 1500);

  
    } finally {
    showLoader(false);
    btn.disabled = false;
    btn.classList.remove("loading");

    if (!isSuccess) { // ✅ 👈 CHECK HERE
      btn.innerText = "Login";
      btn.style.background = "#e50914";
    }
  }
}
  
async function signup() {
  try {
    showLoader(true);
    showError("");

    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    await firebase.auth().createUserWithEmailAndPassword(email, pass);
    setTimeout(() => {
  window.location.href = "app.html";
}, 800);

  } catch (err) {
    showError(err.message);
  } finally {
    showLoader(false);
  }
}

function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();

  firebase.auth().signInWithPopup(provider)
    .then(() => {
  setTimeout(() => {
    window.location.href = "app.html";
  }, 800);
})
    .catch(err => showError(err.message));
}
</script>

</body>
</html>
