<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎬 Movie Tracker Pro</title>

<style>
/* SAME UI (unchanged) */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  color: white;
  text-align: center;
  margin: 0;
  padding: 0 0 60px 0;
}
h1 { color: #e50914; }

input, select {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
  background: #2a2a2a;
  color: white;
}

button {
  padding: 10px;
  background: #e50914;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 10px;
  border-radius: 10px;
}
.card img { width: 100%; border-radius: 10px; }

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  color: #777;
  font-size: 12px;
  padding: 8px 0;
}
</style>
</head>

<body>

<h1>🎬 Movie Tracker Pro</h1>

<input id="movieInput" placeholder="Movie name">
<select id="category">
  <option>Action</option>
  <option>Comedy</option>
  <option>Drama</option>
  <option>Horror</option>
</select>

<button onclick="addMovie()">Add</button>
<button onclick="logout()">🚪 Logout</button>

<div class="container" id="movieList"></div>

<footer>Made by harshskarki Ⓗ</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCcUfxJmbe-iHSGSr8U_xDRKvG1Uz7okwM",
  authDomain: "movie-tracker-pro.firebaseapp.com",
  projectId: "movie-tracker-pro",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let movies = [];

// ✅ AUTH CHECK + LOAD DATA
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    loadMovies();
  }
});

// ✅ LOAD FROM FIRESTORE
function loadMovies() {
  const user = firebase.auth().currentUser;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .get()
    .then(snapshot => {
      movies = [];
      snapshot.forEach(doc => {
        movies.push({ id: doc.id, ...doc.data() });
      });
      displayMovies();
    });
}

// ✅ ADD MOVIE
async function addMovie() {
  let name = movieInput.value.trim();
  let cat = document.getElementById("category").value;

  if (!name) return alert("Enter movie name");

  let movieObj = {
    name,
    category: cat,
    watched: false,
    favorite: false
  };

  const user = firebase.auth().currentUser;

  await db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .add(movieObj);

  movieInput.value = "";
  loadMovies(); // refresh
}

// ✅ DELETE MOVIE
function deleteMovie(id) {
  const user = firebase.auth().currentUser;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(id)
    .delete()
    .then(loadMovies);
}

// ✅ DISPLAY
function displayMovies() {
  let container = document.getElementById("movieList");
  container.innerHTML = "";

  movies.forEach(m => {
    container.innerHTML += `
      <div class="card">
        <h3>${m.name}</h3>
        <p>${m.category}</p>
        <button onclick="deleteMovie('${m.id}')">Delete</button>
      </div>
    `;
  });
}

// ✅ LOGOUT
function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

</body>
</html>
