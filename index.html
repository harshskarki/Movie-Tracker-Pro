<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎬 Movie Tracker Pro</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  color: white;
  text-align: center;
  margin: 0;
}

h1 { color: #e50914; }

input, select {
  padding: 10px;
  margin: 5px;
  border-radius: 5px;
  border: none;
  background: #2a2a2a;
  color: white;
}

button {
  padding: 10px;
  background: #e50914;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  background: #ff1f1f;
}

/* Grid */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 10px;
  border-radius: 10px;
  transition: 0.3s;
}

.card:hover { transform: scale(1.05); }

.card img {
  width: 100%;
  border-radius: 10px;
}

.watched { text-decoration: line-through; color: gray; }
.favorite { color: gold; }

/* Toast */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  padding: 10px 20px;
  border-radius: 5px;
  display: none;
}

/* 🔥 Skeleton Loader */
.skeleton {
  background: linear-gradient(90deg, #1c1c1c 25%, #2a2a2a 50%, #1c1c1c 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: 10px;
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.skeleton-card {
  height: 300px;
}
</style>
</head>

<body>

<h1>🎬 Movie Tracker Pro</h1>

<input id="movieInput" placeholder="Movie name">
<select id="category">
  <option>Action</option>
  <option>Comedy</option>
  <option>Drama</option>
  <option>Horror</option>
</select>

<button onclick="addMovie()">Add</button>
<button onclick="logout()">🚪 Logout</button>

<div class="container" id="movieList"></div>
<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCcUfxJmbe-iHSGSr8U_xDRKvG1Uz7okwM",
  authDomain: "movie-tracker-pro.firebaseapp.com",
  projectId: "movie-tracker-pro",
  storageBucket: "movie-tracker-pro.appspot.com",
  messagingSenderId: "261461241343",
  appId: "1:261461241343:web:727b75c82896b91ac0cbca"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let movies = [];

// Auth check
firebase.auth().onAuthStateChanged(user => {
  if (!user) window.location.href = "login.html";
  else loadMovies();
});

// Toast
function showToast(msg) {
  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

// Skeleton
function showSkeletons() {
  let container = document.getElementById("movieList");
  container.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    container.innerHTML += `<div class="card skeleton skeleton-card"></div>`;
  }
}

// Load from Firestore
function loadMovies() {
  const user = firebase.auth().currentUser;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .get()
    .then(snapshot => {
      movies = [];
      snapshot.forEach(doc => {
        movies.push({ id: doc.id, ...doc.data() });
      });
      displayMovies();
    });
}

// Fetch movie
async function fetchMovieData(name) {
  let res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=279e916fb273ebd5f4db034459cad740&query=${name}`);
  let data = await res.json();
  let m = data.results[0];

  return {
    poster: m?.poster_path ? "https://image.tmdb.org/t/p/w500" + m.poster_path : "",
    rating: m?.vote_average || "N/A",
    year: m?.release_date?.split("-")[0] || "N/A"
  };
}

// Add movie
async function addMovie() {
  let name = movieInput.value.trim();
  let cat = category.value;

  if (!name) return showToast("Enter name");

  showSkeletons();

  let data = await fetchMovieData(name);

  const user = firebase.auth().currentUser;

  let movieObj = { name, category: cat, watched: false, favorite: false, ...data };

  const docRef = await db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .add(movieObj);

  movieObj.id = docRef.id;

  movies.push(movieObj);

  displayMovies();
  showToast("Added!");
}

// Delete
function deleteMovie(i) {
  const user = firebase.auth().currentUser;
  const movie = movies[i];

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(movie.id)
    .delete();

  movies.splice(i, 1);
  displayMovies();
}

// Toggle watched
function toggleWatched(i) {
  const user = firebase.auth().currentUser;
  const movie = movies[i];

  movie.watched = !movie.watched;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(movie.id)
    .update({ watched: movie.watched });

  displayMovies();
}

// Toggle favorite
function toggleFavorite(i) {
  const user = firebase.auth().currentUser;
  const movie = movies[i];

  movie.favorite = !movie.favorite;

  db.collection("users")
    .doc(user.uid)
    .collection("movies")
    .doc(movie.id)
    .update({ favorite: movie.favorite });

  displayMovies();
}

// Display
function displayMovies() {
  let container = document.getElementById("movieList");
  container.innerHTML = "";

  movies.forEach((m, i) => {
    container.innerHTML += `
      <div class="card">
        <img src="${m.poster}">
        <h3 class="${m.watched ? 'watched' : ''} ${m.favorite ? 'favorite' : ''}">${m.name}</h3>
        <p>${m.year} ⭐ ${m.rating}</p>

        <button onclick="toggleWatched(${i})">Watched</button>
        <button onclick="toggleFavorite(${i})">Fav</button>
        <button onclick="deleteMovie(${i})">Delete</button>
      </div>
    `;
  });
}

// Logout
function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

</body>
</html>
