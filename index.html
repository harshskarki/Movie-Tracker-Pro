<!DOCTYPE html>
<html>
<head>
  <title>Movie Tracker Pro</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .bg img {
      position: absolute;
      width: 140px;
      border-radius: 12px;
      opacity: 0.18;
      animation: float 20s linear infinite;
      transition: transform 0.2s ease;
    }

    @keyframes float {
      from { transform: translateY(100vh) rotate(0deg); }
      to { transform: translateY(-120vh) rotate(360deg); }
    }

    .hero {
      padding: 120px 20px 80px;
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 60px;
      color: #e50914;
      text-shadow: 0 0 25px rgba(229,9,20,0.7);
    }

    #typing {
      color: #bbb;
      font-size: 18px;
      max-width: 600px;
      margin: auto;
      min-height: 24px;
    }

    .btn {
      display: inline-block;
      margin-top: 35px;
      padding: 14px 30px;
      border-radius: 12px;
      background: linear-gradient(135deg,#e50914,#ff1f1f);
      color: white;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(229,9,20,0.5);
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(229,9,20,1);
    }

    .features {
      margin: 80px auto;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature {
      width: 230px;
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      transition:0.3s;
    }

    .feature:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 0 20px rgba(229,9,20,0.6);
    }

    footer {
      margin-top:50px;
      padding:15px;
      color:#666;
    }
  </style>
</head>

<body>

<div class="bg">
  <img src="https://image.tmdb.org/t/p/w500/qNBAXBIQlnOThrVvA6mA2B5ggV6.jpg">
  <img src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg">
  <img src="https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg">
  <img src="https://image.tmdb.org/t/p/w500/5P8SmMzSNYikXpxil6BYzJ16611.jpg">
  <img src="https://image.tmdb.org/t/p/w500/9Gtg2DzBhmYamXBS1hKAhiwbBKS.jpg">
  <img src="https://image.tmdb.org/t/p/w500/rSPw7tgCH9c6NqICZef4kZjFOQ5.jpg">
</div>

<div class="hero">
  <h1>🎬 Movie Tracker Pro</h1>
  <p id="typing"></p>
  <a href="login.html" class="btn">🚀 Get Started</a>
</div>

<div class="features">
  <div class="feature"><h3>🎬 Track</h3><p>Manage watchlist</p></div>
  <div class="feature"><h3>⭐ Favorites</h3><p>Save top picks</p></div>
  <div class="feature"><h3>📊 Progress</h3><p>Track watching</p></div>
  <div class="feature"><h3>☁️ Cloud</h3><p>Access anywhere</p></div>
</div>

<footer>Made by harshskarki Ⓗ</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCcUfxJmbe-iHSGSr8U_xDRKvG1Uz7okwM",
  authDomain: "movie-tracker-pro.firebaseapp.com",
  projectId: "movie-tracker-pro",
};
firebase.initializeApp(firebaseConfig);

const btn = document.querySelector(".btn");

// typing effect
const text = "Track your movies like a pro 🎯";
let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(type,40);
  }
}
type();

// parallax
document.addEventListener("mousemove", e=>{
  document.querySelectorAll(".bg img").forEach(img=>{
    let x = (window.innerWidth - e.pageX*0.02)/100;
    let y = (window.innerHeight - e.pageY*0.02)/100;
    img.style.transform = `translate(${x}px,${y}px)`;
  });
});

// auth
btn.innerText = "⏳ Loading...";
firebase.auth().onAuthStateChanged(user=>{
  if(user){
    btn.innerText="🎬 Go to App";
    btn.href="app.html";
  } else {
    btn.innerText="🚀 Get Started";
    btn.href="login.html";
  }
});
</script>

</body>
</html>
